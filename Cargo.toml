[package]
name = "hydrax"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Isaac C. F. Wong"]
description = "Core-collapse supernova gravitational-wave simulation tools"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/isaac-cf-wong/hydrax"
homepage = "https://github.com/isaac-cf-wong/hydrax"
documentation = "https://isaac-cf-wong.github.io/hydrax"
keywords = ["astrophysics", "simulation", "gravitational-waves", "supernova"]
categories = ["science", "simulation"]
exclude = ["/.github"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
rustfft = "6.4.1"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[lib]
name = "hydrax"
path = "src/lib.rs"

[[bin]]
name = "hydrax"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
