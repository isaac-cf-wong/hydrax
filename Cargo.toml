[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Isaac C. F. Wong"]
license = "BSD-3-Clause"
repository = "https://github.com/isaac-cf-wong/hydrax"
homepage = "https://github.com/isaac-cf-wong/hydrax"
documentation = "https://isaac-cf-wong.github.io/hydrax"
keywords = ["astrophysics", "simulation", "gravitational-waves", "supernova"]
categories = ["science", "simulation"]

[workspace.dependencies]
hydrax = { version = "0.1.0", path = "crates/hydrax" }
hydrax-core = { version = "0.1.0", path = "crates/hydrax-core" }
hydrax-io = { version = "0.1.0", path = "crates/hydrax-io" }
hydrax-kernels-sys = { version = "0.1.0", path = "crates/hydrax-kernels-sys" }
hydrax-wave = { version = "0.1.0", path = "crates/hydrax-wave" }
cc = "1.10.0"
clap = { version = "4.6.7", features = ["derive"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
