[project]
site_name = "Hydrax Documentation"
site_description = "Core-collapse supernova gravitational-wave simulation tools."
site_author = "Isaac C. F. Wong"
copyright = """
Copyright &copy; 2026 Isaac C. F. Wong
"""

nav = [
  { "Get Started" = "index.md" },
  { "API" = [
    { "Overview" = "api/index.md" },
  ] },
  { "Design" = [
    { "Quadrupole waveforms" = "design/quadrupole-waveforms.md" },
  ] },
  { "Contributing" = "contributing.md" },
  { "Security" = "security.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[repo]
url = "https://github.com/isaac-cf-wong/hydrax"
name = "hydrax"

[markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}

[markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[markdown_extensions.pymdownx.superfences]

[plugins]
search = {}
