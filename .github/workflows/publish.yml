name: Publish

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: true
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: true
                type: string

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag_name }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

            - name: Verify workspace versions match tag
              # The tag is passed through the environment rather than expanded
              # into the shell source, so a crafted dispatch input cannot
              # inject commands.
              env:
                  TAG_NAME: ${{ inputs.tag_name }}
              run: |
                  EXPECTED_VERSION="${TAG_NAME#v}"
                  cargo metadata --no-deps --format-version 1 > metadata.json
                  MISMATCHED=$(
                    jq -r --arg expected "$EXPECTED_VERSION" \
                      '.packages[] | select(.version != $expected) | "\(.name) is \(.version)"' \
                      metadata.json
                  )
                  rm -f metadata.json
                  if [ -n "$MISMATCHED" ]; then
                    echo "Workspace crates do not match tag $EXPECTED_VERSION:" >&2
                    echo "$MISMATCHED" >&2
                    exit 1
                  fi

            - name: Verify packages
              # hydrax-kernels-sys is `publish = false`: it compiles C sources
              # that live outside its own directory, so a packaged copy of it
              # cannot build and packaging it would fail the release. Excluding
              # it here makes this step check exactly the set that is published.
              run: cargo package --workspace --exclude hydrax-kernels-sys

            - name: Note publish status
              if: vars.PUBLISH_TO_CRATES_IO != 'true'
              run: |
                  echo "Publishing is disabled for this template." >> "$GITHUB_STEP_SUMMARY"
                  echo "Set the repository variable PUBLISH_TO_CRATES_IO to true to enable crates.io publishing." >> "$GITHUB_STEP_SUMMARY"

    publish:
        needs: verify
        # Set the repository variable PUBLISH_TO_CRATES_IO to "true" once the
        # 'crates-io' environment and CARGO_REGISTRY_TOKEN secret are configured.
        if: vars.PUBLISH_TO_CRATES_IO == 'true'
        runs-on: ubuntu-latest
        environment: crates-io
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag_name }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

            - name: Verify workspace versions match tag
              # The tag is passed through the environment rather than expanded
              # into the shell source, so a crafted dispatch input cannot
              # inject commands.
              env:
                  TAG_NAME: ${{ inputs.tag_name }}
              run: |
                  EXPECTED_VERSION="${TAG_NAME#v}"
                  cargo metadata --no-deps --format-version 1 > metadata.json
                  MISMATCHED=$(
                    jq -r --arg expected "$EXPECTED_VERSION" \
                      '.packages[] | select(.version != $expected) | "\(.name) is \(.version)"' \
                      metadata.json
                  )
                  rm -f metadata.json
                  if [ -n "$MISMATCHED" ]; then
                    echo "Workspace crates do not match tag $EXPECTED_VERSION:" >&2
                    echo "$MISMATCHED" >&2
                    exit 1
                  fi

            - name: Publish crates
              # --workspace publishes the workspace members in dependency
              # order, so hydrax-core lands before the crates that require it.
              # hydrax-kernels-sys is excluded for the reason given in `verify`.
              run: cargo publish --workspace --exclude hydrax-kernels-sys --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
