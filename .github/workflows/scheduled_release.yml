name: Scheduled Release

on:
    schedule:
        - cron: "0 0 * * 2"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    check_new_commits:
        runs-on: ubuntu-latest
        outputs:
            has-changes: ${{ steps.check_commits.outputs.has-changes }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            # Release only when something that reaches the published crates changed
            # since the latest tag: their sources and the files they include, the
            # build scripts' declared inputs, Cargo.toml outside dev-only tables,
            # Cargo.lock (hydrax-cli ships a binary), the readmes or the license.
            # The C kernels that hydrax-kernels-sys compiles are listed in `paths`,
            # because its build script names them at build time. Tests, benches,
            # examples, docs, CI and dev-dependency bumps do not count.
            - name: Check for crate changes
              id: check_commits
              uses: isaac-cf-wong/detect-git-changes-action@fd41a9c5553a9148e8f78399855fd19e04801501 # v0.2.0
              with:
                  use-latest-tag: true
                  preset: rust
                  paths: |
                      kernels/include
                      kernels/src

    ci:
        needs: check_new_commits
        if: ${{ needs.check_new_commits.outputs.has-changes == 'true' }}
        uses: ./.github/workflows/ci.yml

    codeql:
        needs: check_new_commits
        if: ${{ needs.check_new_commits.outputs.has-changes == 'true' }}
        uses: ./.github/workflows/codeql.yml
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

    create_tag:
        needs: [ci, codeql]
        runs-on: ubuntu-latest
        outputs:
            new_tag: ${{ steps.tag_version.outputs.new_tag }}
            new_version: ${{ steps.tag_version.outputs.new_version }}
        steps:
            - name: Create release GitHub App token
              id: release_app_token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  token: ${{ steps.release_app_token.outputs.token }}

            - name: Get release GitHub App user ID
              id: release_app_user
              run: echo "user_id=$(gh api "/users/${{ steps.release_app_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ steps.release_app_token.outputs.token }}

            - name: Install git-cliff
              uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
              with:
                  tool: git-cliff

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - name: Bump crate version and push tag
              id: tag_version
              run: |
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
                  if [ "$PREVIOUS_TAG" = "none" ]; then
                    NEW_TAG="v0.1.0"
                  else
                    NEW_TAG=$(git-cliff --bumped-version --config cliff.toml 2>/dev/null)
                  fi
                  if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
                    echo "Creating annotated tag $NEW_TAG"

                    git config user.name "${{ steps.release_app_token.outputs.app-slug }}[bot]"
                    git config user.email "${{ steps.release_app_user.outputs.user_id }}+${{ steps.release_app_token.outputs.app-slug }}[bot]@users.noreply.github.com"

                    NEW_VERSION="${NEW_TAG#v}"
                    NEW_VERSION="$NEW_VERSION" python3 - <<'PY'
                  import datetime
                  import os
                  import re
                  from pathlib import Path

                  cargo_toml = Path("Cargo.toml")
                  version = os.environ["NEW_VERSION"]
                  lines = cargo_toml.read_text(encoding="utf-8").splitlines(keepends=True)

                  # Every crate inherits `[workspace.package] version`, and the
                  # workspace-level path dependencies between them carry a
                  # matching version requirement that must move in lockstep.
                  section = None
                  package_version_updated = False
                  dependency_versions_updated = 0
                  for index, line in enumerate(lines):
                      stripped = line.strip()
                      newline = "\n" if line.endswith("\n") else ""
                      if stripped.startswith("[") and stripped.endswith("]"):
                          section = stripped
                          continue
                      if section == "[workspace.package]" and stripped.startswith("version = "):
                          lines[index] = f'version = "{version}"{newline}'
                          package_version_updated = True
                      elif section == "[workspace.dependencies]" and stripped.startswith("hydrax"):
                          replaced, count = re.subn(
                              r'version = "[^"]*"', f'version = "{version}"', line
                          )
                          if count:
                              lines[index] = replaced
                              dependency_versions_updated += count

                  if not package_version_updated:
                      raise SystemExit(
                          "Could not find [workspace.package] version in Cargo.toml"
                      )
                  if not dependency_versions_updated:
                      raise SystemExit(
                          "Could not find internal hydrax dependency versions in Cargo.toml"
                      )

                  cargo_toml.write_text("".join(lines), encoding="utf-8")

                  # The citation file carries the metadata that Zenodo reads when
                  # the release is published, so its version and date follow the
                  # tag too.
                  citation = Path("CITATION.cff")
                  citation_text = citation.read_text(encoding="utf-8")
                  citation_text, version_count = re.subn(
                      r'(?m)^(version:\s+)"[\d.]+"',
                      rf'\g<1>"{version}"',
                      citation_text,
                  )
                  citation_text, date_count = re.subn(
                      r'(?m)^(date-released:\s+)"\d{4}-\d{2}-\d{2}"',
                      rf'\g<1>"{datetime.date.today().isoformat()}"',
                      citation_text,
                  )
                  if not (version_count and date_count):
                      raise SystemExit(
                          "Could not find version and date-released in CITATION.cff"
                      )
                  citation.write_text(citation_text, encoding="utf-8")
                  PY
                    cargo generate-lockfile

                    if ! git diff --quiet -- Cargo.toml Cargo.lock CITATION.cff; then
                      git add Cargo.toml Cargo.lock CITATION.cff
                      git commit -m "chore(release): prepare for $NEW_TAG [skip ci]"
                      git push origin "HEAD:${GITHUB_REF_NAME}"
                    else
                      echo "Cargo.toml, Cargo.lock and CITATION.cff already match $NEW_TAG"
                    fi

                    git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
                    git push origin "$NEW_TAG"
                  else
                    echo "Tag $NEW_TAG already exists, skipping."
                    exit 1
                  fi
                  echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
                  echo "new_version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

            - name: Output tag information
              run: |
                  echo "### Tag Created" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **New tag**: ${{ steps.tag_version.outputs.new_tag }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Crate version**: ${{ steps.tag_version.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Previous tag**: ${{ steps.tag_version.outputs.previous_tag }}" >> "$GITHUB_STEP_SUMMARY"

    release:
        needs: create_tag
        uses: ./.github/workflows/release.yml
        permissions:
            contents: write
        with:
            tag_name: ${{ needs.create_tag.outputs.new_tag }}

    publish:
        needs: [create_tag, release]
        uses: ./.github/workflows/publish.yml
        secrets: inherit
        with:
            tag_name: ${{ needs.create_tag.outputs.new_tag }}
